<!DOCTYPE html>
<html>
<head>
    <title>Study Planner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #74ebd5, #acb6e5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 20px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 15px;
        }

        .input-section {
            display: flex;
            gap: 5px;
        }

        input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px;
            border: none;
            background: #4CAF50;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 15px;
        }

        li {
            background: #f1f1f1;
            padding: 10px;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 6px;
        }

        li.completed {
            text-decoration: line-through;
            color: gray;
        }

        .delete-btn {
            background: red;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📚 Study Planner</h2>

    <div class="input-section">
        <input type="text" id="taskInput" placeholder="Enter task">
        <button onclick="addTask()">Add</button>
    </div>

    <ul id="taskList"></ul>
</div>

<script>
    function addTask() {
        let input = document.getElementById("taskInput");
        let taskText = input.value.trim();

        if (taskText === "") {
            alert("Please enter a task!");
            return;
        }

        let li = document.createElement("li");

        li.innerHTML = `
            <span onclick="toggleTask(this)">${taskText}</span>
            <span class="delete-btn" onclick="deleteTask(this)">X</span>
        `;

        document.getElementById("taskList").appendChild(li);
        input.value = "";
    }

    function deleteTask(element) {
        element.parentElement.remove();
    }

    function toggleTask(element) {
        element.parentElement.classList.toggle("completed");
    }
</script>

</body>
</html>
