<!DOCTYPE html>
<html>
<head>
    <title>Study Planner</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f0f4f8;
            text-align: center;
        }

        .container {
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            width: 70%;
            padding: 8px;
        }

        button {
            padding: 8px;
            background: blue;
            color: white;
            border: none;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 8px;
            margin: 5px;
            background: #e3e3e3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Study Planner</h2>
        <input type="text" placeholder="Enter task">
        <button>Add</button>

        <ul>
            <li>Example Task</li>
        </ul>
    </div>

</body>
</html>
